<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimalist Notes</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>NOTES GENERATOR</h1>

      <form id="uploadForm">
        <label for="pdfFile" class="custom-file-upload"> CHOOSE PDF </label>
        <input type="file" id="pdfFile" name="file" accept=".pdf" required />
        <button type="submit" id="generateBtn">GENERATE NOTES</button>
      </form>

      <div id="loading">
        <div class="spinner"></div>
        <p>GENERATING...</p>
      </div>

      <div id="tabs" style="display: none">
        <button class="tab-btn active" data-tab="notes">NOTES</button>
        <button class="tab-btn" data-tab="flashcards">FLASHCARDS</button>
      </div>

      <div id="results"></div>

      <div id="flashcardsContainer" style="display: none">
        <div id="flashcardDeck"></div>
        <div id="flashcardNav">
          <button id="prevCard">&#8592; PREV</button>
          <span id="cardCounter"></span>
          <button id="nextCard">NEXT &#8594;</button>
        </div>
      </div>
    </div>
    <script src="/static/script.js"></script>
  </body>
</html>
